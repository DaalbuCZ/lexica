<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lexica - Lexer studio</title><script src="theme.js"></script><link rel="stylesheet" href="style.css?v=31"></head><body class="properties-hidden">
<header><a class="brand" href="./"><span class="logo">λ</span> lexica</a><div class="top-actions"><span class="local"><i></i> Saved locally</span></div></header>
<main>

<div id="app-menu" class="layout-popover app-menu" popover="auto" role="dialog" aria-label="Application menu"><button id="import" aria-label="Import" title="Import machine"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M4 15v6h16v-6"/></svg><span>Import</span></button><button id="export" aria-label="Export" title="Export machine"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 15v6h16v-6"/></svg><span>Export</span></button><button id="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode"><svg class="tool-icon theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg><svg class="tool-icon theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>Theme</span></button></div>
<div id="layout-menu" class="layout-popover" popover="auto" role="dialog" aria-label="Auto layout options"><strong>Auto layout</strong><label class="layout-field">Layout<select id="layout-mode" aria-label="Auto layout style" title="Auto layout style"><option value="tree">Tree</option><option value="circle">Radial</option></select></label><label class="layout-field">Density<select id="layout-density" aria-label="Auto layout density" title="Auto layout density"><option value="0.35">Extra compact</option><option value="0.5">Compact</option><option value="0.75" selected>Normal</option><option value="1">Spacious</option></select></label><button id="arrange" class="primary">Apply layout</button></div>
<aside class="inspector" role="dialog" aria-label="Properties"><div class="inspector-title">Properties <button id="close-properties" aria-label="Close properties">✕</button></div><div id="properties"></div></aside>
<div class="minimap"><div class="map-controls" role="group" aria-label="View controls"><button id="fit" title="Fit diagram" aria-label="Fit diagram"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg></button><button id="zoom-out" title="Zoom out" aria-label="Zoom out"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><button id="zoom-in" title="Zoom in" aria-label="Zoom in"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-7-7v14"/></svg></button></div><svg id="minimap" viewBox="0 0 1200 700" aria-label="Minimap: click or drag to navigate"></svg></div>
<div class="canvas-status"><div id="tips-panel"><button id="hide-tips" aria-label="Hide tips" title="Hide tips">×</button><span id="modehint">Right-click a state to connect · Ctrl+right-click to create a new node with connection · Double-click to add · Drag canvas to pan</span></div><button id="show-tips" hidden aria-label="Show tips" title="Show tips"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4m0 4h0"/></svg></button></div>

</main>
<dialog id="export-dialog"><div class="dialog-heading"><div><h2>Export your machine</h2></div><button id="close-dialog" aria-label="Close">✕</button></div><div class="export-options"><label>Format<select id="format"><option value="tex">LaTeX / TikZ (.tex)</option><option value="json">Editable machine (.json)</option><option value="svg">Vector diagram (.svg)</option></select></label><label id="standalone-label"><input id="standalone" type="checkbox" checked> Complete compilable document</label></div><textarea id="export-preview" spellcheck="false" readonly></textarea><p class="export-help">Uses TikZ's automata library. Compile with pdfLaTeX or LuaLaTeX.</p><div class="dialog-actions"><button id="copy">Copy to clipboard</button><button id="download" class="primary">↓ Download .tex</button></div></dialog><dialog id="import-dialog" aria-labelledby="import-heading"><div class="dialog-heading"><h2 id="import-heading">Import machine</h2><button id="close-import" aria-label="Close import"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><label class="field-label" for="import-json">PASTE MACHINE JSON</label><textarea id="import-json" rows="10" spellcheck="false" placeholder="Paste exported machine JSON here"></textarea><p id="import-error" role="alert"></p><div class="dialog-actions"><button id="import-file">Choose .json file</button><button id="import-paste" class="primary">Import JSON</button></div></dialog><input type="file" id="file" accept=".json,application/json" hidden><div id="toast" role="status"></div><script type="module" src="app.js?v=33"></script></body></html>
