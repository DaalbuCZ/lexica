<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lexica — Lexer studio</title><link rel="stylesheet" href="style.css"></head><body class="properties-hidden">
<header><a class="brand" href="./"><span class="logo">λ</span> lexica</a><div class="top-actions"><span class="local"><i></i> Saved locally</span><button id="import">↥ Import</button><button id="export" class="primary">↓ Export <span>LaTeX</span></button></div></header>
<main>
<div class="canvas-wrap"><svg id="canvas" viewBox="0 0 1200 700" aria-label="Finite state machine editor"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64756c"/></marker></defs><g id="diagram"></g></svg></div>
<nav class="toolbar" aria-label="Diagram tools"><button id="add" title="Add state">＋ <span>State</span></button><span class="separator"></span><button id="undo" title="Undo" aria-label="Undo">↶</button><button id="redo" title="Redo" aria-label="Redo">↷</button><span class="separator"></span><button id="arrange" title="Arrange states and avoid overlaps">⌘ <span>Auto layout</span></button><button id="fit" title="Fit diagram" aria-label="Fit diagram">⛶</button><button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button><button id="zoom-in" title="Zoom in" aria-label="Zoom in">＋</button><button id="toggle-properties" aria-label="Toggle properties" aria-expanded="false">☷</button></nav>
<aside class="inspector" role="dialog" aria-label="Properties"><div class="inspector-title">Properties <button id="close-properties" aria-label="Close properties">✕</button></div><div id="properties"></div></aside>
<div class="minimap"><svg id="minimap" viewBox="0 0 1200 700" aria-label="Minimap: click or drag to navigate"></svg><span>Overview</span></div>
<div class="canvas-status"><span id="machine-info"></span><span id="modehint">Right-click a state to connect · Double-click to add · Drag canvas to pan</span><button id="reset">Load example</button></div>
<section class="tester"><div class="panel-title"><h2>Lexer tester</h2><div class="tester-actions"><label class="skip-label"><input type="checkbox" id="show-skipped"> Show skipped</label><button id="toggle-tester" aria-label="Collapse tester" aria-expanded="true">⌄</button></div></div><div class="test-grid"><div><label class="field-label" for="input">INPUT</label><textarea id="input" spellcheck="false">hello 42 world</textarea></div><div><div class="output-label"><label class="field-label">TOKENS</label><span id="token-count"></span></div><div id="tokens"></div></div></div></section>
</main>
<dialog id="export-dialog"><div class="dialog-heading"><div><h2>Export your machine</h2></div><button id="close-dialog" aria-label="Close">✕</button></div><div class="export-options"><label>Format<select id="format"><option value="tex">LaTeX / TikZ (.tex)</option><option value="json">Editable machine (.json)</option><option value="svg">Vector diagram (.svg)</option></select></label><label id="standalone-label"><input id="standalone" type="checkbox" checked> Complete compilable document</label></div><textarea id="export-preview" spellcheck="false" readonly></textarea><p class="export-help">Uses TikZ's automata library. Compile with pdfLaTeX or LuaLaTeX.</p><div class="dialog-actions"><button id="copy">Copy to clipboard</button><button id="download" class="primary">↓ Download .tex</button></div></dialog><input type="file" id="file" accept=".json,application/json" hidden><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
