<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How auto layout works · Lexica</title>
    <meta name="description" content="An interactive tour of how Lexica arranges state machines." />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('lexica-theme') === 'light' ? 'light' : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
